# Fill workspace_url from the workspace stack output.
workspace_url: "https://<workspace-host>"
security:
  compliance_security_profile: { enabled: false, standards: [] }
  enhanced_security_monitoring: false
  disable_legacy_dbfs: true
  disable_legacy_access: true
sql_warehouses:
  - name: serverless-default
    cluster_size: 2X-Small
    min_num_clusters: 1
    max_num_clusters: 2
    auto_stop_mins: 10
